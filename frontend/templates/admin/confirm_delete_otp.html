{% extends "admin/base_site.html" %}
{% block content %}
  <!-- ✅ Show Django messages here -->
    {% if messages %}
    <ul class="messagelist">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}

  <h2>Enter OTP to confirm deletion</h2>
  <form method="post" action="{% url 'admin:frontend_products_confirm_delete_otp' product_id %}">
    {% csrf_token %}
    <input type="text" name="otp" placeholder="Enter OTP" required>
    <button type="submit">Verify & Delete</button>
  </form>
{% endblock %}
